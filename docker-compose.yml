services:
  backend:
    build: .
    image: denism22/genrepos-backend
    container_name: back-con
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/gen_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=12345
    depends_on:
      - db

  frontend:
    build: ./frontend
    image: denism22/genrepos-frontend
    container_name: front-con
    ports:
      - "3000:3000"
    depends_on:
      - backend

  db:
    image: postgres:17
    container_name: db-con
    restart: always
    environment:
      POSTGRES_DB: gen_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5432:5432"

  prometheus:
    image: prom/prometheus
    container_name: prometheus-con
    ports:
      - "9090:9090"
    volumes:
      - ./src/main/resources/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./resources:/prometheus
    networks:
      monitoring:
        aliases:
          - prometheus

  grafana:
    image: grafana/grafana
    container_name: grafana-con
    ports:
      - "3000:3000"
    volumes:
      - ./src/main/resources/grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      monitoring:
        aliases:
          - grafana

networks:
  monitoring: